# Static analysis, because `npm audit` is not it.
#
# npm audit is an advisory-database lookup: it tells you whether a dependency
# someone else already reported is in your tree. It says nothing about the code
# in this repository.
#
# Every POST route here runs regular expressions over untrusted text (the
# injection screen in src/lib/guard.ts, the refine parser in src/lib/refine/),
# so a polynomial-backtracking pattern would let one small request burn seconds
# of CPU. CodeQL's js/polynomial-redos query finds that class. It runs on every
# push, and weekly so that newly published queries are run against unchanged
# code.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 04:17 UTC. Off the hour on purpose: scheduled runs cluster there.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The only elevated permission in this repository, and the narrowest that
      # lets results reach the Security tab.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialise CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: javascript-typescript
          # security-extended adds the ReDoS and injection queries that the
          # default suite leaves out. They are the ones that matter for a
          # service whose whole input is untrusted text.
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          category: /language:javascript-typescript
